name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: null_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: lint
        run: nix develop --command golangci-lint run ./...
      - name: run tests
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/null_test?sslmode=disable
        run: nix develop --command go test ./... -v
      - name: build deployable package
        run: nix build --no-link

  notify:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NULL_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'xhos',
              repo: 'null',
              workflow_id: 'update-input.yml',
              ref: 'main',
              inputs: { input: 'null-core' },
            });
